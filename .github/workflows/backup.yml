name: Encrypted Particl backups
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Dry run or explicitly enabled capture
        type: choice
        options: [dry-run, capture]
        default: dry-run
  # Weekly backups run from scripts/ops/weekly-backup.mjs inside a maintenance
  # window (docs/weekly-backup.md); the schedule only checks freshness, daily.
  schedule:
    - cron: "47 6 * * *"
permissions:
  contents: read
  actions: read
concurrency:
  group: particl-encrypted-backups
  cancel-in-progress: false
jobs:
  disabled:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'capture' && (vars.PARTICL_BACKUP_ENABLED != 'true' || github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Capture is disabled until protected credentials, inventory, key escrow and enforced quiescence are configured; capture runs only from main."
          exit 1
  dry-run:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'dry-run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/ops/backup-automation.mjs plan
      - run: node --test tests/ops/*.test.mjs
  capture:
    if: vars.PARTICL_BACKUP_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'capture'
    environment: particl-backup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture only quiesced sources and rehearse the entire restore
        id: backup
        run: node scripts/ops/backup-automation.mjs capture
        env:
          PARTICL_BACKUP_ENABLED: ${{ vars.PARTICL_BACKUP_ENABLED }}
          PARTICL_BACKUP_SOURCE_JSON: ${{ secrets.PARTICL_BACKUP_SOURCE_JSON }}
          PARTICL_BACKUP_ENV_JSON: ${{ secrets.PARTICL_BACKUP_ENV_JSON }}
          PARTICL_BACKUP_KEY: ${{ secrets.PARTICL_BACKUP_KEY }}
          PARTICL_BACKUP_QUIESCENCE_JSON: ${{ secrets.PARTICL_BACKUP_QUIESCENCE_JSON }}
      - name: Keep the verified ciphertext forever in the dedicated backup store
        run: node scripts/ops/archive-backup.mjs "${{ steps.backup.outputs.bundle_path }}" "backups/${{ github.run_id }}-${{ github.run_attempt }}"
        env:
          PARTICL_BACKUP_ARCHIVE_TOKEN: ${{ secrets.PARTICL_BACKUP_ARCHIVE_TOKEN }}
      - name: Also retain the verified ciphertext as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: particl-backup-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.backup.outputs.bundle_path }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
          overwrite: false
      - name: Remove decrypted verification and encrypted runner copies
        if: always()
        run: rm -rf "$RUNNER_TEMP/particl-backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
  freshness:
    if: always() && vars.PARTICL_BACKUP_ENABLED == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.operation == 'dry-run')
    needs: [capture]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scripts/ops/backup-automation.mjs freshness
        env:
          GITHUB_TOKEN: ${{ github.token }}
