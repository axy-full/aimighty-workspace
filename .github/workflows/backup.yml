name: Encrypted Particl backups
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Dry run or explicitly enabled capture
        type: choice
        options: [dry-run, capture]
        default: dry-run
  schedule:
    - cron: "17 2 * * *"
    - cron: "47 * * * *"
permissions:
  contents: read
concurrency:
  group: particl-encrypted-backups
  cancel-in-progress: false
jobs:
  disabled:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'capture' && (vars.PARTICL_BACKUP_ENABLED != 'true' || github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Capture is disabled until protected credentials, inventory, key escrow and enforced quiescence are configured; capture runs only from main."
          exit 1
  dry-run:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'dry-run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/ops/backup-automation.mjs plan
      - run: node --test tests/ops/*.test.mjs
  capture:
    if: vars.PARTICL_BACKUP_ENABLED == 'true' && github.ref == 'refs/heads/main' && (github.event.schedule == '17 2 * * *' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'capture'))
    environment: particl-backup
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The fence receipt expires 30 minutes after its last renewal; a capture
      # still running past that point cannot verify and publishes nothing.
      - name: Capture only quiesced sources and rehearse the entire restore
        id: backup
        timeout-minutes: 35
        run: node scripts/ops/backup-automation.mjs capture
        env:
          PARTICL_BACKUP_ENABLED: ${{ vars.PARTICL_BACKUP_ENABLED }}
          PARTICL_BACKUP_SOURCE_JSON: ${{ secrets.PARTICL_BACKUP_SOURCE_JSON }}
          PARTICL_BACKUP_ENV_JSON: ${{ secrets.PARTICL_BACKUP_ENV_JSON }}
          PARTICL_BACKUP_KEY: ${{ secrets.PARTICL_BACKUP_KEY }}
          PARTICL_BACKUP_QUIESCENCE_JSON: ${{ secrets.PARTICL_BACKUP_QUIESCENCE_JSON }}
      # Only the verified ciphertext leaves the runner, to the PRIVATE bucket
      # (never a GitHub artifact: the repository is public). This step sees
      # the bucket credentials only, not the production source credentials.
      - name: Upload verified ciphertext to the private backup bucket
        id: upload
        timeout-minutes: 45
        run: node scripts/ops/backup-automation.mjs upload "$BUNDLE_PATH"
        env:
          BUNDLE_PATH: ${{ steps.backup.outputs.bundle_path }}
          PARTICL_BACKUP_SUMMARY_JSON: ${{ steps.backup.outputs.summary }}
          BACKUP_TARGET_R2_ACCOUNT_ID: ${{ secrets.BACKUP_TARGET_R2_ACCOUNT_ID }}
          BACKUP_TARGET_R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_TARGET_R2_ACCESS_KEY_ID }}
          BACKUP_TARGET_R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_TARGET_R2_SECRET_ACCESS_KEY }}
          BACKUP_TARGET_R2_BUCKET: ${{ secrets.BACKUP_TARGET_R2_BUCKET }}
          BACKUP_TARGET_R2_ENDPOINT: ${{ secrets.BACKUP_TARGET_R2_ENDPOINT }}
      - name: Remove decrypted verification and encrypted runner copies
        if: always()
        run: rm -rf "$RUNNER_TEMP/particl-backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
  freshness:
    if: always() && vars.PARTICL_BACKUP_ENABLED == 'true' && github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && inputs.operation == 'dry-run')
    needs: [capture]
    environment: particl-backup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Newest complete bundle in the private bucket is under 26 hours old
        run: node scripts/ops/backup-automation.mjs freshness
        env:
          BACKUP_TARGET_R2_ACCOUNT_ID: ${{ secrets.BACKUP_TARGET_R2_ACCOUNT_ID }}
          BACKUP_TARGET_R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_TARGET_R2_ACCESS_KEY_ID }}
          BACKUP_TARGET_R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_TARGET_R2_SECRET_ACCESS_KEY }}
          BACKUP_TARGET_R2_BUCKET: ${{ secrets.BACKUP_TARGET_R2_BUCKET }}
          BACKUP_TARGET_R2_ENDPOINT: ${{ secrets.BACKUP_TARGET_R2_ENDPOINT }}
