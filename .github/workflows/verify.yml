name: Verify Particl
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit shard
        run: npm run test:unit -- --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: unit-failure-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
  core:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reject known high and critical dependency vulnerabilities
        run: npm audit --audit-level=high
      - run: npm run lint
      - name: Rehearse encrypted backup and restore
        run: node --test tests/ops/*.test.mjs
      - run: node scripts/account-http-rehearsal.mjs
      - run: npm run build
        env:
          ENGINE_MOCK: '1'
      - name: Verify production bundle privacy
        run: npm run test:unit -- tests/unit/bundle.spec.ts
  browser-shards:
    strategy:
      fail-fast: false
      matrix:
        suite: [workbench, customer]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    # Shards ran 19-25 min against a 25 min ceiling on 19 Sep and were
    # cancelled mid-run; six shards restore headroom as specs keep landing.
    # Eight since 25 Sep: the first shard's dev server, after the Astra and
    # media specs, ran out of room compiling the public site's routes and the
    # runner was shut down three times at the same test. Fewer specs per
    # server keeps every shard's memory well clear of the runner's limit.
    timeout-minutes: 30
    env:
      ENGINE_MOCK: '1'
      APP_ORIGIN: http://localhost:4551
      PW_BASE_URL: http://localhost:4551
      PLATFORM_DATABASE_URL: file:.data/browser-platform.db
      PW_PLATFORM_DATABASE_URL: file:.data/browser-platform.db
      TURSO_DATABASE_URL: file:.data/browser-legacy.db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start isolated mock development server
        run: |
          npm run dev -- -p 4551 > dev-ci.log 2>&1 &
          for attempt in {1..90}; do
            if curl --fail --silent http://localhost:4551/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat dev-ci.log
          exit 1
      - name: Browser suite
        # Memory, disk and the largest processes every 30 s, in this step's own
        # log: a runner that is shut down leaves no artifacts, so this is the
        # only record of what grew before it went.
        run: |
          ( while true; do echo "[resources] $(date -u +%T) $(free -m | awk '/Mem:/{print "mem "$3"/"$2" MB"}') $(df -m . | awk 'NR==2{print "disk free "$4" MB"}') | $(ps -eo rss=,comm= --sort=-rss | head -4 | awk '{printf "%s %d MB; ", $2, $1/1024}')"; sleep 30; done ) &
          npx playwright test --config=playwright.${{ matrix.suite }}.config.ts --shard=${{ matrix.shard }}/8 --output=ci-results/${{ matrix.suite }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure-${{ matrix.suite }}-${{ matrix.shard }}
          path: |
            ci-results/
            dev-ci.log
          retention-days: 7
  # Keep the existing required-check names. A failed or cancelled shard must
  # fail these gates instead of allowing a partial browser run to pass.
  browser:
    if: always()
    needs: browser-shards
    strategy:
      fail-fast: false
      matrix:
        suite: [workbench, customer]
    runs-on: ubuntu-latest
    steps:
      - name: Require every browser shard
        env:
          SHARD_RESULT: ${{ needs.browser-shards.result }}
        run: test "$SHARD_RESULT" = success
