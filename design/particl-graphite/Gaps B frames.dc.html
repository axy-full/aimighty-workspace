<div style="padding:28px 32px 56px;display:flex;flex-direction:column;gap:32px;font-size:13px;line-height:1.45">
  <div style="display:flex;flex-direction:column;gap:6px">

  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="7">

      <div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start">
        <sc-for list="{{ g.frames }}" as="f" hint-placeholder-count="3">
          <div id="{{ f.id }}" style="display:flex;flex-direction:column;gap:8px">
            <div style="display:flex;align-items:center;gap:10px"><span style="font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;font-weight:600;letter-spacing:0.06em;padding:2px 8px;border-radius:999px;background:rgba(10,132,255,0.14);border:1px solid rgba(10,132,255,0.35);color:#6EB4FF">{{ f.badge }}</span><strong style="font-size:13px;font-weight:600">{{ f.title }}</strong></div>
            <div style="position:relative;width:{{ f.w }}px;height:{{ f.h }}px;overflow:hidden;border:1px solid rgba(255,255,255,0.12);border-radius:8px;background:#000"><iframe src="{{ f.src }}" title="{{ f.title }}" loading="lazy" style="width:{{ f.fw }}px;height:{{ f.fh }}px;border:0;display:block;transform:scale({{ f.scale }});transform-origin:0 0"></iframe></div>
            <a href="{{ f.src }}" target="_blank" style="font-size:12px">Open ›</a>
          </div>
        </sc-for>
      </div>
    </section>
  </sc-for>
</div>
