<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>/* Offline bundle: React, ReactDOM and Babel load from ./assets/vendor instead of unpkg. */window.__resources = Object.assign({}, window.__resources, { "https://unpkg.com/react@18.3.1/umd/react.production.min.js": "assets/vendor/react.production.min.js", "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js": "assets/vendor/react-dom.production.min.js", "https://unpkg.com/@babel/standalone@7.29.0/babel.min.js": "assets/vendor/babel.min.js" });</script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<style>
html,body{margin:0;background:#000;color:#F5F5F7;-webkit-font-smoothing:antialiased;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Geist,system-ui,sans-serif}
*{box-sizing:border-box}
a{color:#6EB4FF;text-decoration:none}a:hover{color:#8FC4FF}
</style>
</helmet>
<div style="padding:28px 32px 48px;display:flex;flex-direction:column;gap:28px;font-size:13px;line-height:1.45">
  <div style="display:flex;flex-direction:column;gap:6px">
    <h1 style="margin:0;font-size:22px;font-weight:600;letter-spacing:-0.02em">Particl · step 7 · Phone (judge, not make)</h1>
    <p style="margin:0;font-size:13px;color:rgba(235,235,245,0.6)">Eleven frames, live at 390 × 844. Flat Graphite, text ≥ 12 px, targets ≥ 44 px, clear of the notch and the home indicator.</p>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:20px">
    <sc-for list="{{ frames }}" as="f" hint-placeholder-count="8">
      <section id="{{ f.id }}" style="display:flex;flex-direction:column;gap:8px;width:{{ w }}px">
        <div style="display:flex;align-items:center;gap:10px"><span style="font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;font-weight:600;letter-spacing:0.08em;padding:2px 8px;border-radius:999px;background:rgba(10,132,255,0.14);border:1px solid rgba(10,132,255,0.35);color:#6EB4FF">{{ f.badge }}</span><strong style="font-size:13.5px;font-weight:600">{{ f.title }}</strong></div>
        <div style="position:relative;width:{{ w }}px;height:{{ h }}px;overflow:hidden;border:1px solid rgba(255,255,255,0.12);border-radius:28px;background:#000"><iframe src="{{ f.src }}" title="{{ f.title }}" style="width:390px;height:844px;border:0;display:block;transform:scale({{ scale }});transform-origin:0 0"></iframe></div>
        <div style="display:flex;justify-content:space-between;gap:10px;font-size:12px;color:rgba(235,235,245,0.6)"><span>{{ f.line }}</span><a href="{{ f.src }}" target="_blank">Open ›</a></div>
      </section>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const scale = 0.72, M = 'Particl%20Suites.dc.html?device=phone&screen=';
    const frames = [
      ['a', 'Home', 'Needs you first: approvals with the price as the button, renders with live progress, takes to review; then projects. Credits in the header.', M + 'home'],
      ['b1', 'Notification', '“Plan ready · Dune Studies · 66 cr” and the plan it opens', M + 'plan&from=notification'],
      ['b2', 'Plan approval', 'Every paid step priced, the fix allowance, the total, the balance after, the admin step marked; Approve · 66 cr, Change, Hold', M + 'plan'],
      ['b3', 'Plan · short balance', 'Balance 40 cr · short by 26 cr · Top up sits right there; Approve waits', M + 'plan&credits=short'],
      ['c', 'Review', 'The take fills the screen; versions, Atomik’s note; swipe right to approve, left to reject; Undo toast. Swiping never spends.', M + 'review'],
      ['d', 'Change with words', 'A short box with the price and the fixes left (fix 1 of 2)', M + 'fix'],
      ['e1', 'Project record', 'Brief, every approval quoted → settled, open decisions, spend against the budget', M + 'record'],
      ['e2', 'Record · paused at 80%', 'The pause card: Continue · 43 cr or Stop', M + 'record&paused=1'],
      ['f', 'Make', 'One prompt box, the type switch, the one-line engine summary with Change, Make · 43 cr', M + 'make'],
      ['g', 'Atomik', 'A bottom sheet; Ask · free for how-to questions, Ask · up to 4 cr otherwise', M + 'atomik'],
      ['h', 'States', 'Rendering with progress; failed with “Nothing billed” and Retry; insufficient credits with Top up; offline', M + 'states']
    ].map(([badge, title, line, src]) => ({ id: 'f' + badge, badge: badge.toUpperCase(), title, line, src }));
    return { frames, scale, w: Math.round(390 * scale), h: Math.round(844 * scale) };
  }
}
</script>
</body>
</html>
