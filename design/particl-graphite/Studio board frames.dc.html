<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>/* Offline bundle: React, ReactDOM and Babel load from ./assets/vendor instead of unpkg. */window.__resources = Object.assign({}, window.__resources, { "https://unpkg.com/react@18.3.1/umd/react.production.min.js": "assets/vendor/react.production.min.js", "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js": "assets/vendor/react-dom.production.min.js", "https://unpkg.com/@babel/standalone@7.29.0/babel.min.js": "assets/vendor/babel.min.js" });</script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<style>
html,body{margin:0;background:#000;color:#F5F5F7;-webkit-font-smoothing:antialiased;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Geist,system-ui,sans-serif}
*{box-sizing:border-box}
a{color:#6EB4FF;text-decoration:none}a:hover{color:#8FC4FF}
</style>
</helmet>
<div style="padding:28px 32px 48px;display:flex;flex-direction:column;gap:28px;font-size:13px;line-height:1.45">
  <div style="display:flex;flex-direction:column;gap:6px">
    <h1 style="margin:0;font-size:22px;font-weight:600;letter-spacing:-0.02em">Particl · step 3 · the Studio board</h1>
    <p style="margin:0;font-size:13px;color:rgba(235,235,245,0.6)">Seventeen frames of one board, live at 1440 × 900 with header B. Each frame is a state of the same file; click through inside any frame.</p>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax({{ w }}px,1fr));gap:20px">
    <sc-for list="{{ frames }}" as="f" hint-placeholder-count="13">
      <section id="{{ f.id }}" style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;align-items:center;gap:10px"><span style="font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;font-weight:600;letter-spacing:0.08em;padding:2px 8px;border-radius:999px;background:rgba(10,132,255,0.14);border:1px solid rgba(10,132,255,0.35);color:#6EB4FF">{{ f.badge }}</span><strong style="font-size:13.5px;font-weight:600">{{ f.title }}</strong></div>
        <div style="position:relative;width:{{ w }}px;height:{{ h }}px;overflow:hidden;border:1px solid rgba(255,255,255,0.12);border-radius:8px;background:#000"><iframe src="{{ f.src }}" title="{{ f.title }}" style="width:1440px;height:900px;border:0;display:block;transform:scale({{ scale }});transform-origin:0 0"></iframe></div>
        <div style="display:flex;justify-content:space-between;gap:10px;font-size:12px;color:rgba(235,235,245,0.6)"><span>{{ f.line }}</span><a href="{{ f.src }}" target="_blank">Open ›</a></div>
      </section>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { vw: window.innerWidth };
  componentDidMount() { this._r = () => this.setState({ vw: window.innerWidth }); window.addEventListener('resize', this._r); }
  componentWillUnmount() { window.removeEventListener('resize', this._r); }
  renderVals() {
    const scale = Math.max(0.3, Math.min(0.5, (this.state.vw - 84) / 2900));
    const M = 'Particl%20Suites.dc.html?view=board&frame=';
    const frames = [
      ['a', 'Empty board', 'What are we making? · Attach · aspect and length · Start · up to 4 cr · templates'],
      ['b', 'Questions', 'Atomik’s panel opens with three questions · chips, a free field, Use your judgement'],
      ['c', 'Looks', 'Four look frames · tick one, or tell Atomik what to change'],
      ['d', 'Storyboard', 'The brief as a document · one frame per shot in the chosen look · rail: Brief and Looks done, Storyboard needs you'],
      ['e', 'Approval', 'Make 3 shots · 93 cr · fixes up to 186 cr · steps folded · Approve, Change, Hold'],
      ['f', 'Rendering', 'Frames become takes in place · Shot 1 the look anchor · Rendering 1 of 3 · Stop'],
      ['q', 'F2 · the 80 % pause', 'Later in the render: 161 of 200 cr · Shot 2’s second fix would pass the budget · Continue or Stop'],
      ['g', 'Take review', 'v1 / v2 · Approve, Reject · Atomik’s one-line note'],
      ['h', 'Cast, environment, elements', 'Image-led cards · identity status · Build identity · 54 cr · the consent record'],
      ['i', 'Cut and Deliver', 'Approved takes in order · mini timeline · spec check · Render master · free'],
      ['j', 'Where to next?', 'Three small cards'],
      ['k', 'Inspector on a take', 'Large preview · prompt · engine line · price paid · versions · history · Advanced folded'],
      ['l', 'Review mode', 'J K A R Space C · side by side and slider compare'],
      ['m', 'Crew review', 'Ask the crew in the panel · converged notes as cards'],
      ['n', 'Project record', 'Brief · approvals priced → settled · open decisions · spend against the budget'],
      ['o', 'Library drawer', 'A look frame dragged onto a shot'],
      ['p', 'History drawer', 'What changed and who did it, newest first']
    ].map(([id, title, line]) => ({ id, badge: id === 'q' ? 'F2' : id.toUpperCase(), title, line, src: M + (id === 'q' ? 'f2' : id) }));
    return { frames, scale, w: Math.round(1440 * scale), h: Math.round(900 * scale) };
  }
}
</script>
</body>
</html>
