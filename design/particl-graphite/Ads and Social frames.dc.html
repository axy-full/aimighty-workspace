<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>/* Offline bundle: React, ReactDOM and Babel load from ./assets/vendor instead of unpkg. */window.__resources = Object.assign({}, window.__resources, { "https://unpkg.com/react@18.3.1/umd/react.production.min.js": "assets/vendor/react.production.min.js", "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js": "assets/vendor/react-dom.production.min.js", "https://unpkg.com/@babel/standalone@7.29.0/babel.min.js": "assets/vendor/babel.min.js" });</script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<style>
html,body{margin:0;background:#000;color:#F5F5F7;-webkit-font-smoothing:antialiased;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Geist,system-ui,sans-serif}
*{box-sizing:border-box}
a{color:#6EB4FF;text-decoration:none}a:hover{color:#8FC4FF}
</style>
</helmet>
<div style="padding:28px 32px 48px;display:flex;flex-direction:column;gap:28px;font-size:13px;line-height:1.45">
  <div style="display:flex;flex-direction:column;gap:6px">
    <h1 style="margin:0;font-size:22px;font-weight:600;letter-spacing:-0.02em">Particl · step 5 · Ads and Social on the board</h1>
    <p style="margin:0;font-size:13px;color:rgba(235,235,245,0.6)">Five frames, live at 1440 × 900, header B, the outline rail with each board’s own sections.</p>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax({{ w }}px,1fr));gap:20px">
    <sc-for list="{{ frames }}" as="f" hint-placeholder-count="5">
      <section id="{{ f.id }}" style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;align-items:center;gap:10px"><span style="font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;font-weight:600;letter-spacing:0.08em;padding:2px 8px;border-radius:999px;background:rgba(10,132,255,0.14);border:1px solid rgba(10,132,255,0.35);color:#6EB4FF">{{ f.badge }}</span><strong style="font-size:13.5px;font-weight:600">{{ f.title }}</strong></div>
        <div style="position:relative;width:{{ w }}px;height:{{ h }}px;overflow:hidden;border:1px solid rgba(255,255,255,0.12);border-radius:8px;background:#000"><iframe src="{{ f.src }}" title="{{ f.title }}" style="width:1440px;height:900px;border:0;display:block;transform:scale({{ scale }});transform-origin:0 0"></iframe></div>
        <div style="display:flex;justify-content:space-between;gap:10px;font-size:12px;color:rgba(235,235,245,0.6)"><span>{{ f.line }}</span><a href="{{ f.src }}" target="_blank">Open ›</a></div>
      </section>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { vw: window.innerWidth };
  componentDidMount() { this._r = () => this.setState({ vw: window.innerWidth }); window.addEventListener('resize', this._r); }
  componentWillUnmount() { window.removeEventListener('resize', this._r); }
  renderVals() {
    const scale = Math.max(0.3, Math.min(0.5, (this.state.vw - 84) / 2900));
    const M = 'Particl%20Suites.dc.html?view=board&kind=';
    const frames = [
      ['A1', 'Ads · from a product page', 'Brand kit, product facts and the reference ad, waiting for review · rail: Brand, Product, Hooks, Formats, Ads, Adapt, Deliver', M + 'ads&frame=1'],
      ['A2', 'Ads · hooks, formats, ads', '12 hooks · 6 formats · image ads, video ads, UGC with consent · Adapt', M + 'ads&frame=2'],
      ['A3', 'Ads · the poster Designer', 'A full editor from a card · layers · full-size PNG export · free', M + 'ads&frame=3'],
      ['S1', 'Social · source and clips', 'A long video in · clips with hook, captions and 9:16 · rail: Source, Clips, Hooks, Effects, Posts', M + 'social&frame=1'],
      ['S2', 'Social · hooks, effects, posts', 'A scored hook review with reasons · priced effects · narrated video · a post per platform, approved by a person', M + 'social&frame=2']
    ].map(([badge, title, line, src]) => ({ id: badge.toLowerCase(), badge, title, line, src }));
    return { frames, scale, w: Math.round(1440 * scale), h: Math.round(900 * scale) };
  }
}
</script>
</body>
</html>
