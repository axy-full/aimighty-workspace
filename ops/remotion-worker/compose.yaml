# Remotion export worker: one single-slot CPU container (headless Chromium + FFmpeg), one export at a time.
# 3 vCPU / 8 GB, no GPU. Starting limits; they are set from the 30 s 1080p measurement (README, "Limits")
# and changed only through a PR to this file, never by hand in the platform.
#
# Deploy as a Docker Compose resource in the self-host platform (Coolify), base directory
# /ops/remotion-worker, compose file /compose.yaml. No domain, no port: nothing here is published.
# Full click list and checks: README.md.
#
# Build context is the repository root (the compositions are in /remotion); see Dockerfile.
#
# Network (option (c), the relay; ops/render-worker/README.md, "Networking"):
#  - `remotion-internal` is declared `internal: true`, so Compose creates it with no gateway: nothing on it can reach
#    the internet.
#  - The worker is on it through `network_mode: remotion-internal` and on nothing else: no internet, no other network,
#    no published port. (Coolify adds its own network, which has a gateway, to a service without network_mode.)
#  - `remotion-relay` is on `remotion-internal` and, because Connect To Predefined Network is on, on the app's network
#    too. It forwards port 8081 to the worker's 8790 and nothing else, holds no secret, and never reads a connection's
#    bytes: the worker's own bearer check still guards every request.
#  - REMOTION_WORKER_URLS names the relay: http://<relay name>:8081.
# Fail-closed start (server.mjs): before it listens, the worker runs the egress check (ops/render-worker/check-egress.mjs,
# option c) in its own network and environment; anything but a pass logs the failing lines, waits 30 s and exits non-zero.
# `restart: unless-stopped` retries it; the 30 s wait is what stops a hot loop. Whatever the layout, the check run by hand
# (README.md, Verify step 1) is a hard gate before any real export.
#
# Secret: REMOTION_WORKER_SECRET, one per worker (at least 32 characters, never in git). The
# production app holds REMOTION_WORKER_URLS and REMOTION_WORKER_SECRETS (same order) and sends the
# worker its own secret as `Authorization: Bearer <secret>`.
#
# Memory: tmpfs counts against mem_limit. The two tmpfs mounts are at most 3 GB + 0.75 GB when full;
# that is why they are sized here and why 8 GB is the starting figure. The session tmpfs holds a maximum upload
# (600 MiB) and one output: a 60 s ProRes 422 HQ file is about 1.4 GB (measured 716 MB for 30 s), an H.264 one far less.
# A render itself peaked near 1.8 GiB (measured, 15 Oct 2026).

services:
  remotion-1:
    build:
      context: ../..
      dockerfile: ops/remotion-worker/Dockerfile
    init: true                  # tini reaps orphans (Chrome helpers); the server sweeps strays per session
    restart: unless-stopped
    environment:
      REMOTION_WORKER_SECRET: ${REMOTION_WORKER_SECRET:?set REMOTION_WORKER_SECRET}
      REMOTION_CONCURRENCY: "2"   # frames rendered at once; measured in README "Limits"
      REMOTION_MAX_SECONDS: "120" # longest finished video this worker accepts
    cpus: 3
    cpu_shares: 256             # yields to the production app when the machine is busy
    mem_limit: 8g
    memswap_limit: 8g
    pids_limit: 1024            # Chrome and its helpers, the compositor and ffmpeg
    read_only: true
    tmpfs:
      - /vercel/sandbox:size=3072m,uid=10001,gid=10001,mode=0700
      - /tmp:size=768m,uid=10001,gid=10001,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 15s
    network_mode: remotion-internal
    depends_on: [remotion-relay]  # the relay's network is what creates remotion-internal
    container_name: remotion-1

  remotion-relay:
    build:
      context: ../..
      dockerfile: ops/remotion-worker/Dockerfile
      target: relay
    init: true
    restart: unless-stopped
    environment:
      RELAY_TARGET_1: ${RELAY_TARGET_1:-remotion-1}
    cpus: 0.25
    cpu_shares: 128
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 5s
    networks: [remotion-internal]
    healthcheck:
      test: ["CMD", "/usr/local/bin/node", "-e", "require('net').connect(8081, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  remotion-internal:
    name: remotion-internal
    internal: true
